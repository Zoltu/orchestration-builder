<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Adaptive Orchestrator — Run</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<header>
			<h1>Adaptive Orchestrator</h1>
			<p id="status" class="status">loading…</p>
		</header>

		<main>
			<section id="run-summary" class="panel">
				<h2>Run</h2>
				<dl id="run-meta"></dl>
			</section>

			<section id="roles-panel" class="panel">
				<h2>Role activity</h2>
				<ul id="roles"></ul>
			</section>

			<section id="questions-panel" class="panel">
				<h2>Pending questions</h2>
				<ul id="questions"></ul>
			</section>

			<section id="log-panel" class="panel">
				<h2>Recent log</h2>
				<ol id="log"></ol>
			</section>
		</main>

		<script src="/app.js"></script>
	</body>
</html>

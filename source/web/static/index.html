<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1f2933" />
		<meta name="description" content="Submit tasks and monitor runs." />
		<title>Adaptive Orchestrator</title>
		<!-- The default favicon is the three-state favicon's 'complete' state (source/web/static/ts/favicon.ts faviconHref), inlined so the first paint already carries an icon; app.js swaps the href as questions arrive and runs start and finish. -->
		<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M8%202l6%2011H2Z%22%20fill%3D%22%2326a269%22%2F%3E%3C%2Fsvg%3E" />
		<link rel="stylesheet" href="vendor/highlight-github.css" />
		<link rel="stylesheet" href="stylesheets/styles.css" />
	</head>
	<body>
		<div id="app"></div>
		<noscript>
			<p style="font-family: system-ui, sans-serif; padding: 1.5rem; margin: 0;">The Adaptive Orchestrator UI requires JavaScript to run.</p>
		</noscript>
		<!-- The Markdown rendering libraries are vendored as static assets (no node_modules in the deployed image) and exposed as globals: `window.showdown` parses Markdown to HTML, `window.hljs` highlights fenced code. They are classic deferred scripts so they load in order before the deferred app module, which reads the globals. See docs/security.md "Web client rendering pipeline". -->
		<script defer src="vendor/showdown.js"></script>
		<script defer src="vendor/highlight.js"></script>
		<script type="module" src="app.js"></script>
	</body>
</html>
